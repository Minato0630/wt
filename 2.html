
<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #e6f2ff;
        }

        .container {
            width: 450px;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #003366;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="tel"],
        textarea,
        select {
            padding: 8px;
            margin: 5px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        input[type="submit"],
        input[type="reset"] {
            background-color: #003366;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            color: green;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Registration Form</h2>

<form onsubmit="showMessage(event)">

    Name:
    <input type="text" required><br><br>

    Password:
    <input type="password" required><br><br>

    Email:
    <input type="email" required><br><br>

    Phone Number:
    <input type="tel" required><br><br>

    Sex:
    <input type="radio" name="sex" required> Male
    <input type="radio" name="sex"> Female
    <input type="radio" name="sex"> Other
    <br><br>

    Date of Birth:

    <select required>
        <option value="">Day</option>
        <script>
            for(let i=1; i<=31; i++)
                document.write("<option>"+i+"</option>");
        </script>
    </select>

    <select required>
        <option value="">Month</option>
        <script>
            for(let i=1; i<=12; i++)
                document.write("<option>"+i+"</option>");
        </script>
    </select>

    <select required>
        <option value="">Year</option>
        <script>
            for(let i=2000; i<=2026; i++)
                document.write("<option>"+i+"</option>");
        </script>
    </select>

    <br><br>

    Languages Known:<br>

    <input type="checkbox"> English
    <input type="checkbox"> Telugu
    <input type="checkbox"> Hindi
    <input type="checkbox"> Tamil

    <br><br>

    Address:<br>
    <textarea rows="4" cols="35"></textarea>

    <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

</form>

<h3 id="result"></h3>

</div>

<script>
function showMessage(event) {
    event.preventDefault();

    document.getElementById("result").innerHTML =
    "Your registration process is successfully completed";
}
</script>

</body>
</html>
