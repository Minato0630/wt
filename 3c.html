<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thousands Separator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            background-color: #ffffff;
            padding: 35px 30px;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 51, 102, 0.12);
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        .icon-badge {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            background: #e0f2fe;
            color: #0284c7;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        h2 {
            color: #003366;
            margin-bottom: 20px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
            margin-bottom: 16px;
        }

        input[type="number"]:focus {
            border-color: #003366;
            box-shadow: 0 0 0 3px rgba(0, 51, 102, 0.12);
        }

        button {
            width: 100%;
            background-color: #003366;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #002244;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 51, 102, 0.25);
        }

        #result {
            margin-top: 18px;
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
            padding: 14px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="icon-badge">🔢</div>
    <h2>Thousands Separator</h2>

    <input type="number" id="num" placeholder="Enter an integer (e.g. 1000000)" autofocus>

    <button onclick="showNumber()">Format Number</button>

    <p id="result"></p>

</div>

<script>
function showNumber() {
    let n = document.getElementById("num").value;
    let res = document.getElementById("result");

    if (n === "") {
        res.style.display = "block";
        res.style.color = "#dc2626";
        res.innerHTML = "⚠️ Please enter a number!";
        return;
    }

    let result = Number(n).toLocaleString("en-US");
    res.style.display = "block";
    res.style.color = "#003366";
    res.innerHTML = "Formatted: <span style='color:#0284c7;'>" + result + "</span>";
}

document.getElementById("num").addEventListener("keypress", function(e) {
    if (e.key === "Enter") showNumber();
});
</script>

</body>
</html>
