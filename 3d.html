
<!DOCTYPE html>
<html>
<head>
    <title>Odd or Even</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }

        h2 {
            color: blue;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

<h2>Odd or Even Numbers</h2>

<script>
for (let i = 0; i <= 15; i++) {

    if (i % 2 == 0) {
        document.write(i + " is Even<br>");
    }
    else {
        document.write(i + " is Odd<br>");
    }

}
</script>

</body>
</html>
