<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odd or Even Numbers</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 35px 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0, 51, 102, 0.12);
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        .icon-badge {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            background: #e0f2fe;
            color: #0284c7;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        h2 {
            color: #003366;
            margin-bottom: 6px;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 22px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .item {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.15s;
        }

        .item:hover {
            transform: scale(1.02);
        }

        .even {
            background-color: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }

        .odd {
            background-color: #faf5ff;
            color: #7e22ce;
            border: 1px solid #e9d5ff;
        }

        .badge-type {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .even .badge-type {
            background: #dbeafe;
            color: #1e40af;
        }

        .odd .badge-type {
            background: #f3e8ff;
            color: #6b21a8;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="icon-badge">⚖️</div>
    <h2>Odd or Even Numbers</h2>
    <p class="subtitle">Looping through integers from 0 to 15</p>

    <div class="grid-container">
        <script>
        for (let i = 0; i <= 15; i++) {
            if (i % 2 === 0) {
                document.write("<div class='item even'><span>" + i + "</span><span class='badge-type'>Even</span></div>");
            }
            else {
                document.write("<div class='item odd'><span>" + i + "</span><span class='badge-type'>Odd</span></div>");
            }
        }
        </script>
    </div>
</div>

</body>
</html>
